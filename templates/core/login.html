<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión | Plataforma Académica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --card: #111111;
      --border: rgba(255,255,255,0.08);
      --accent: #c9a06a;
      --gold: #e8c9a3;
      --text: #f0ede9;
      --muted: #7a7470;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 120% 70% at 50% -15%, rgba(185,95,45,0.055), transparent 52%),
        radial-gradient(ellipse 90% 55% at 0% 100%, rgba(160,75,40,0.04), transparent 48%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 1.5rem;
      color: var(--text);
    }
    .login-card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }
    .login-top {
      background: linear-gradient(135deg, rgba(201,160,106,0.1), rgba(120,65,40,0.06));
      border-bottom: 1px solid var(--border);
      padding: 1.8rem;
      text-align: center;
    }
    .logo-wrap {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      margin: 0 auto 0.8rem;
      background: linear-gradient(135deg, var(--accent), var(--gold));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45), 0 0 0 1px rgba(201,160,106,0.08);
    }
    .input-group-dark {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      overflow: hidden;
    }
    .input-group-dark:focus-within { border-color: var(--accent); }
    .input-group-dark .ig-icon {
      padding: 0 0.75rem;
      color: var(--muted);
    }
    .input-group-dark input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      padding: 0.65rem 0.75rem 0.65rem 0;
      outline: none;
    }
    .input-group-dark input:-webkit-autofill,
    .input-group-dark input:-webkit-autofill:hover,
    .input-group-dark input:-webkit-autofill:focus,
    .input-group-dark input:-webkit-autofill:active {
      -webkit-text-fill-color: var(--text);
      -webkit-box-shadow: 0 0 0 1000px rgba(255,255,255,0.04) inset;
      box-shadow: 0 0 0 1000px rgba(255,255,255,0.04) inset;
      caret-color: var(--text);
      transition: background-color 9999s ease-in-out 0s;
    }
    .btn-enter {
      width: 100%;
      border: none;
      border-radius: 0.65rem;
      background: linear-gradient(135deg, #a87b4a, #7a4a2a);
      color: #faf7f2;
      font-weight: 700;
      padding: 0.72rem;
    }
    .btn-enter:hover { opacity: 0.93; }
    .alert-banner {
      display: flex; align-items: flex-start; gap: 0.65rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-size: 0.83rem;
      line-height: 1.45;
    }
    .alert-banner .bi { flex-shrink: 0; margin-top: 0.12rem; font-size: 1.05rem; }
    .alert-banner-error {
      background: rgba(55,28,28,0.55);
      border: 1px solid rgba(140,65,65,0.45);
      color: #f0ada5;
    }
    .alert-banner-info {
      background: rgba(42,38,34,0.75);
      border: 1px solid rgba(201,160,106,0.2);
      color: #d8c8b4;
    }
    .helper-box {
      margin-top: 0.9rem;
      background: rgba(201,160,106,0.06);
      border: 1px solid rgba(201,160,106,0.14);
      border-radius: 0.6rem;
      padding: 0.7rem 0.85rem;
      font-size: 0.77rem;
      color: var(--muted);
    }
    .helper-link {
      margin-top: 1rem;
      display: block;
      text-align: center;
      color: var(--gold);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
    }
    .helper-link:hover { color: #e0b14a; }
    .quick-btn {
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 0.45rem;
      font-size: 0.74rem;
      padding: 0.28rem 0.55rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-top">
      <div class="logo-wrap">
        <i class="bi bi-mortarboard-fill text-white" style="font-size:1.4rem;"></i>
      </div>
      <h1 style="font-size:1.2rem;font-weight:700;margin:0 0 0.15rem;">Iniciar sesión</h1>
      <p style="font-size:0.76rem;color:var(--muted);margin:0;">Universidad Anáhuac Puebla · Plataforma Académica</p>
    </div>

    <div style="padding:1.5rem 1.75rem;">
      {% if info %}
      <div class="alert-banner alert-banner-info mb-3" role="status">
        <i class="bi bi-check-circle-fill"></i><span>{{ info }}</span>
      </div>
      {% endif %}

      {% if error %}
      <div class="alert-banner alert-banner-error mb-3" role="alert">
        <i class="bi bi-exclamation-circle-fill"></i><span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div style="margin-bottom:0.85rem;">
          <label style="font-size:0.79rem;font-weight:600;color:var(--muted);margin-bottom:0.35rem;display:block;">ID institucional</label>
          <div class="input-group-dark">
            <span class="ig-icon"><i class="bi bi-upc-scan"></i></span>
            <input type="text" name="dato_acceso" id="idInput" placeholder="12345678" value="{{ prefill_dato }}" required />
          </div>
        </div>

        <div style="margin-bottom:1.2rem;">
          <label style="font-size:0.79rem;font-weight:600;color:var(--muted);margin-bottom:0.35rem;display:block;">Contraseña</label>
          <div class="input-group-dark">
            <span class="ig-icon"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" id="passInput" placeholder="Ingresa tu contraseña" required />
          </div>
          <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.75rem;color:var(--muted);margin-top:0.45rem;cursor:pointer;">
            <input type="checkbox" id="showPassLogin" style="accent-color:#c9a06a;" />
            Mostrar contraseña
          </label>
        </div>

        <button type="submit" class="btn-enter">
          <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
        </button>
      </form>

      <div class="helper-box">
        <div style="margin-bottom:0.35rem;"><strong>Acceso demo rápido</strong></div>
        <button type="button" class="quick-btn" onclick="fillDemo('90000001','demo123')">Docente demo</button>
        <button type="button" class="quick-btn" onclick="fillDemo('90000002','demo123')">Alumno demo</button>
        <button type="button" class="quick-btn" onclick="fillDemo('90000003','demo123')">Coordinación demo</button>
        <button type="button" class="quick-btn" onclick="fillDemo('26000000','ADMINISTRACION26')" style="border-color:rgba(167,139,250,0.45);">Director (admin)</button>
      </div>
      <p style="font-size:0.72rem;color:var(--muted);margin:0.6rem 0 0;text-align:center;">Director: ID <code style="color:var(--gold);">26000000</code> · contraseña indicada en el botón</p>

      <a href="{% url 'core:crear_cuenta' %}" class="helper-link">
        <i class="bi bi-person-plus me-1"></i>¿No tienes cuenta? Crear cuenta
      </a>
    </div>
  </div>

  <script>
    function fillDemo(idInstitucional, pass) {
      document.getElementById('idInput').value = idInstitucional;
      document.getElementById('passInput').value = pass;
    }
    document.getElementById('showPassLogin').addEventListener('change', function () {
      document.getElementById('passInput').type = this.checked ? 'text' : 'password';
    });
  </script>
</body>
</html>
